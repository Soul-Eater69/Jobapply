version: "3.9"

services:
  jobapply:
    build: .
    container_name: jobapply
    ports:
      - "8000:8000"

    # .env is optional — app works with defaults if missing
    env_file:
      - path: .env
        required: false

    environment:
      # SQLite stored in the named volume so it survives rebuilds
      - DATABASE_URL=sqlite:////app/data/jobapply.db

    volumes:
      - jobapply-db:/app/data               # SQLite database (persistent)
      - ./sessions:/app/sessions            # Browser cookies (avoids re-login)
      - ./resumes:/app/resumes              # Generated PDF resumes
      - ./cover_letters:/app/cover_letters  # Generated cover letters
      # Optional: mount your own profile to override the built-in default
      # - ./user_profile.yaml:/app/user_profile.yaml

    restart: unless-stopped
    shm_size: "512mb"   # Chromium needs this

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  jobapply-db:
