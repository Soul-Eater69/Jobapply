version: "3.9"

services:
  jobapply:
    build: .
    container_name: jobapply
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent data — survives container restarts
      - ./sessions:/app/sessions          # Browser session cookies (avoids repeated login)
      - ./resumes:/app/resumes            # Generated PDF resumes
      - ./cover_letters:/app/cover_letters # Generated cover letters
      - ./user_profile.yaml:/app/user_profile.yaml  # Your resume profile
      - jobapply-db:/app/data             # SQLite database
    restart: unless-stopped
    # Chromium needs at least 512MB shared memory for stability
    shm_size: "512mb"
    environment:
      - DB_PATH=/app/data/jobapply.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  jobapply-db:
